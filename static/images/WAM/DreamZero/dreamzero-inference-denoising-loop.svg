<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 17px; }
      .box { stroke-width: 2; rx: 14; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">DreamZero 推理：视频 latent 去噪循环</text>

  <rect x="55" y="105" width="245" height="100" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="177" y="143" text-anchor="middle" class="label">初始视频噪声</text>
  <text x="177" y="177" text-anchor="middle" class="small">zₜ（VAE latent）</text>

  <rect x="370" y="95" width="300" height="120" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="520" y="135" text-anchor="middle" class="label">Causal Wan DiT</text>
  <text x="520" y="169" text-anchor="middle" class="small">输入：zₜ + actionₜ + 条件</text>
  <text x="520" y="195" text-anchor="middle" class="small">输出：视频 flow vₜ</text>

  <rect x="755" y="105" width="310" height="100" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="910" y="143" text-anchor="middle" class="label">FlowUniPC Scheduler</text>
  <text x="910" y="177" text-anchor="middle" class="small">zₜ + vₜ + timestep → zₜ₋₁</text>

  <path d="M300 155 L370 155" class="arrow"/>
  <path d="M670 155 L755 155" class="arrow"/>
  <path d="M910 205 C910 285 520 285 520 220" class="loop"/>
  <text x="715" y="270" text-anchor="middle" class="small" fill="#7c3aed">新 latent zₜ₋₁ 进入下一轮 DiT</text>

  <rect x="370" y="330" width="300" height="92" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="520" y="367" text-anchor="middle" class="label">循环结束</text>
  <text x="520" y="399" text-anchor="middle" class="small">最终未来视频 latent z₀</text>
  <path d="M910 205 C910 355 760 376 670 376" class="arrow"/>
  <text x="825" y="350" text-anchor="middle" class="small">达到最后一步</text>

  <rect x="370" y="495" width="300" height="90" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="520" y="531" text-anchor="middle" class="label">VAE Decoder（只在最后）</text>
  <text x="520" y="562" text-anchor="middle" class="small">latent z₀ → RGB 帧</text>
  <path d="M520 422 L520 495" class="arrow"/>

  <rect x="370" y="650" width="300" height="72" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="520" y="693" text-anchor="middle" class="label">预测的未来 RGB 视频</text>
  <path d="M520 585 L520 650" class="arrow"/>

  <rect x="55" y="330" width="245" height="255" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="177" y="369" text-anchor="middle" class="label">每轮不做的事情</text>
  <text x="177" y="415" text-anchor="middle" class="small">不把 latent decode 为 RGB</text>
  <text x="177" y="451" text-anchor="middle" class="small">不把 RGB 再 encode 回 latent</text>
  <text x="177" y="500" text-anchor="middle" class="small">循环始终停留在</text>
  <text x="177" y="532" text-anchor="middle" class="small">VAE latent 空间</text>
</svg>
