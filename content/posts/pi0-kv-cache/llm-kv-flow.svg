<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1040" viewBox="0 0 420 1040" role="img" aria-labelledby="title desc">
  <title id="title">LLM：处理新 token，逐步追加 KV</title>
  <desc id="desc">提示词经过 prefill 得到逐层 KV 并预测首个 token。每轮输入刚生成的 token，计算其 Q、K、V 并读取旧缓存，追加新 KV，再预测下一个 token。未结束时循环处理新 token，结束后输出文本。缓存的逻辑长度逐渐增加。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b3a; text-anchor: middle; font-size: 20px; }
      .heading { font-size: 27px; font-weight: 700; text-anchor: start; }
      .subheading { font-size: 17px; fill: #475569; text-anchor: start; }
      .small { font-size: 17px; fill: #475569; }
      .node { stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="420" height="1040" fill="#ffffff" rx="16"/>
  <text x="24" y="40" class="heading">LLM · 自回归生成</text>
  <text x="24" y="72" class="subheading">循环轴：逐个处理新 token</text>

  <rect x="40" y="98" width="300" height="72" class="node" fill="#f1f5f9"/>
  <text x="190" y="129">输入提示词</text>
  <text x="190" y="155" class="small">P 个 token</text>
  <path d="M190 170 V202" class="edge"/>

  <rect x="40" y="206" width="300" height="104" class="node" fill="#e0f2fe"/>
  <text x="190" y="238">提示词 Prefill</text>
  <text x="190" y="266">缓存提示词的逐层 K / V</text>
  <text x="190" y="294" class="small">预测第一个 token</text>
  <path d="M190 310 V346" class="edge"/>

  <rect x="40" y="350" width="300" height="72" class="node" fill="#fff7ed"/>
  <text x="190" y="380">输入刚生成的 token</text>
  <text x="190" y="407" class="small">采样之后，再送回模型</text>
  <path d="M190 422 V456" class="edge"/>

  <rect x="40" y="460" width="300" height="108" class="node" fill="#fff7ed"/>
  <text x="190" y="491">计算该 token 的 Q / K / V</text>
  <text x="190" y="521">用新 Q 读取已有逐层 KV</text>
  <text x="190" y="550" class="small">旧位置不重新前向</text>
  <path d="M190 568 V602" class="edge"/>

  <rect x="40" y="606" width="300" height="92" class="node" fill="#e0f2fe"/>
  <text x="190" y="637">追加该 token 的 KV</text>
  <text x="190" y="663" class="small">长度 P → P+1 → P+2 → …</text>
  <text x="190" y="687" class="small">预测下一个 token</text>
  <path d="M190 698 V716" class="edge"/>

  <path d="M190 720 L312 770 L190 820 L68 770 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="190" y="777">生成结束？</text>
  <path d="M312 770 H386 V386 H344" class="edge"/>
  <text x="360" y="749" class="small">否</text>
  <path d="M190 820 V868" class="edge"/>
  <text x="211" y="852" class="small">是</text>

  <rect x="40" y="872" width="300" height="74" class="node" fill="#ecfdf5"/>
  <text x="190" y="903">输出文本</text>
  <text x="190" y="931" class="small">缓存含提示词与已处理生成位置</text>

  <text x="210" y="989">处理新 token → KV 变长</text>
  <text x="210" y="1018" class="small">因果掩码保证旧位置不受新位置影响</text>
</svg>
