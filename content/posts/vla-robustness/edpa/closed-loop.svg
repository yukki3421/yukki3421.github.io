<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 272" role="img" aria-labelledby="title description">
  <title id="title">LIBERO 中的闭环任务评估</title>
  <desc id="description">策略结合当前相机画面和任务指令给出动作。仿真环境执行动作，新的物体和夹爪位置出现在下一帧画面中。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#506772"/>
    </marker>
  </defs>
  <rect width="540" height="272" fill="#fff"/>
  <g fill="none" stroke="#506772" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M407 32v22"/>
    <path d="M233 92h66"/>
    <path d="M407 129v54"/>
    <path d="M307 221h-66"/>
    <path d="M133 184v-51"/>
  </g>
  <g stroke-width="1.5">
    <rect x="32" y="60" width="202" height="66" rx="8" fill="#edf3f9" stroke="#c2d3df"/>
    <rect x="306" y="60" width="202" height="66" rx="8" fill="#edf3f9" stroke="#c2d3df"/>
    <rect x="306" y="188" width="202" height="66" rx="8" fill="#e7f3ef" stroke="#bfdcd1"/>
    <rect x="32" y="188" width="202" height="66" rx="8" fill="#e7f3ef" stroke="#bfdcd1"/>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
    <g fill="#172f3a" font-size="22">
      <text x="133" y="88">摄像头观测</text>
      <text x="407" y="88">VLA 策略</text>
      <text x="407" y="216">机器人动作</text>
      <text x="133" y="216">仿真环境</text>
    </g>
    <g font-size="16.5" fill="#395661">
      <text x="407" y="25">任务指令</text>
      <text x="133" y="113">物体与夹爪的位置</text>
      <text x="407" y="113">结合观测和指令</text>
      <text x="407" y="241">移动、闭合夹爪等</text>
      <text x="133" y="241">执行动作并更新状态</text>
      <text x="173" y="164">下一帧</text>
    </g>
  </g>
</svg>
