<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 272" role="img" aria-labelledby="title desc">
  <title id="title">EDPA 的两种比较</title>
  <desc id="desc">上半图将原图视觉向量与贴图视觉向量比较。下半图将原图和贴图分别与同一条指令计算相似度，再比较两组结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 9 5 0 10Z" fill="#506772"/>
    </marker>
  </defs>
  <rect width="490" height="272" fill="#fff"/>
  <g fill="none" stroke="#506772" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M116 56v18l39 18"/>
    <path d="M374 56v18l-39 18"/>
    <path d="M116 192v18l39 18"/>
    <path d="M374 192v18l-39 18"/>
  </g>
  <g stroke-width="1.3">
    <g fill="#edf3f9" stroke="#c2d3df">
      <rect x="22" y="11" width="189" height="42" rx="6"/><rect x="279" y="11" width="189" height="42" rx="6"/>
    </g>
    <g fill="#e7f3ef" stroke="#bfdcd1">
      <rect x="22" y="149" width="189" height="42" rx="6"/><rect x="279" y="149" width="189" height="42" rx="6"/>
    </g>
  </g>
  <path d="M22 134h446" stroke="#cfdbde"/>
  <g text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#172f3a" font-size="18">
    <text x="116" y="39">原图的视觉向量</text><text x="374" y="39">贴图的视觉向量</text>
    <text x="245" y="113" fill="#28567d">式（2）同一位置能否匹配回来？</text>
    <text x="116" y="177">原图与指令的相似度</text><text x="374" y="177">贴图与同一指令的相似度</text>
    <text x="245" y="251" fill="#096b65">式（3）图文关系改变了多少？</text>
  </g>
</svg>
